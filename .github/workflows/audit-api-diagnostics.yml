name: Audit API diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public API responses
        run: |
          node --input-type=module <<'NODE'
          const base = 'https://de-impresa-audit.vercel.app/api/audit';
          const origin = 'https://timileyinadekunle17-dev.github.io';
          for (const [name, options] of [
            ['preflight', { method: 'OPTIONS', headers: { Origin: origin, 'Access-Control-Request-Method': 'POST', 'Access-Control-Request-Headers': 'content-type' } }],
            ['get', { method: 'GET', headers: { Origin: origin } }]
          ]) {
            const response = await fetch(base, options);
            const body = await response.text();
            console.log(JSON.stringify({
              test: name,
              status: response.status,
              headers: Object.fromEntries(['content-type','access-control-allow-origin','x-vercel-id'].map(k => [k,response.headers.get(k)])),
              body: body.slice(0, 2000)
            }, null, 2));
          }
          NODE
