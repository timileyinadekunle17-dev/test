name: Audit API diagnostics

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify public API CORS preflight
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://timileyinadekunle17-dev.github.io';
          const response = await fetch('https://de-impresa-audit.vercel.app/api/audit', {
            method: 'OPTIONS',
            headers: {
              Origin: origin,
              'Access-Control-Request-Method': 'POST',
              'Access-Control-Request-Headers': 'content-type'
            }
          });
          const allowed = response.headers.get('access-control-allow-origin');
          if (response.status !== 204 || allowed !== origin) {
            throw new Error(`CORS failed: status=${response.status}, allow-origin=${allowed}`);
          }
          console.log('CORS preflight passed.');
          NODE

      - name: Run real audit and verify Google PageSpeed Insights mobile and desktop
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://de-impresa-audit.vercel.app/api/audit', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: 'https://example.com', format: 'json' }),
            signal: AbortSignal.timeout(290000)
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Audit failed with HTTP ${response.status}: ${body.slice(0, 1200)}`);
          const result = JSON.parse(body);
          if (!result.success || !result.audit?.inspection?.finalUrl) {
            throw new Error('The API did not return real website inspection data.');
          }
          const psi = result.audit.external?.pageSpeedInsights;
          const psiStatus = psi?.status || 'not reported';
          const mobile = psi?.results?.mobile;
          const desktop = psi?.results?.desktop;
          console.log(JSON.stringify({
            result: 'INSPECTION_RETURNED',
            inspectedUrl: result.audit.inspection.finalUrl,
            pageSpeedInsights: psiStatus,
            mobilePageSpeed: mobile?.categories || null,
            desktopPageSpeed: desktop?.categories || null
          }, null, 2));
          if (psiStatus !== 'completed' || mobile?.status !== 'measured' || desktop?.status !== 'measured') {
            throw new Error('Google PageSpeed Insights mobile and desktop results were not both returned.');
          }
          if (psiStatus !== 'completed') {
            throw new Error(`PageSpeed Insights did not complete: ${psiStatus}`);
          }
          NODE

      - name: Generate and verify PDF report
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://de-impresa-audit.vercel.app/api/audit', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: 'https://example.com', format: 'pdf' }),
            signal: AbortSignal.timeout(290000)
          });
          if (!response.ok) {
            const body = await response.text();
            throw new Error(`PDF request failed with HTTP ${response.status}: ${body.slice(0, 1200)}`);
          }
          const type = response.headers.get('content-type') || '';
          const bytes = new Uint8Array(await response.arrayBuffer());
          const signature = new TextDecoder().decode(bytes.slice(0, 5));
          if (!type.includes('application/pdf') || signature !== '%PDF-') {
            throw new Error(`PDF verification failed: content-type=${type}, signature=${signature}`);
          }
          console.log(`PDF report passed: ${bytes.length} bytes.`);
          NODE
