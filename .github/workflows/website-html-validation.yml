name: Main Website HTML and Script Validation

on:
  push:
    branches: [main]
    paths:
      - index.html
      - .github/workflows/website-html-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate inline JavaScript and team profile markup
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const match of scripts) {
            if (/type=["']application\/ld\+json["']/i.test(match[1])) continue;
            const code = match[2].trim();
            if (!code) continue;
            new vm.Script(code, { filename: 'inline-script-' + (++checked) + '.js' });
          }
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/gi)].map(m => m[1]);
          const newIds = ids.filter(id => id.startsWith('de-impresa-profile-') || id.startsWith('de-impresa-team-expert-profile-modal'));
          const duplicates = newIds.filter((id, i) => newIds.indexOf(id) !== i);
          if (duplicates.length) throw new Error('Duplicate new HTML ids: ' + [...new Set(duplicates)].join(', '));
          const teamStart = html.indexOf('<section id="team"');
          const certStart = html.indexOf('<section id="certifications"', teamStart);
          if (teamStart < 0 || certStart < 0) throw new Error('Team or certification section missing');
          const team = html.slice(teamStart, certStart);
          const profileCards = [...team.matchAll(/<button\b[^>]*>[\s\S]*?<img[^>]*class=["'][^"']*team-profile-image[^"']*["'][\s\S]*?<\/button>/gi)];
          if (profileCards.length !== 14) throw new Error('Expected 14 team profile cards; found ' + profileCards.length);
          const modalStart = html.indexOf('<script id="de-impresa-team-expert-profile-modal-script">');
          const modalEnd = html.indexOf('</script>', modalStart);
          if (modalStart < 0 || modalEnd < 0) throw new Error('Team profile modal script missing');
          const modal = html.slice(modalStart, modalEnd);
          if (!modal.includes('de-impresa-profile-whatsapp') || !modal.includes('Hello De Impresa Globals!')) {
            throw new Error('Team profile modal contact branding is incomplete');
          }
          if (/DETRUTH AGENCY|Detruth Agency/i.test(modal)) throw new Error('Outdated agency branding remains in team profile modal');
          console.log('Validated ' + checked + ' inline scripts and all ' + profileCards.length + ' team profile cards.');
          NODE
