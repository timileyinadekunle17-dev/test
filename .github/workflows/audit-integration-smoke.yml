name: Audit platform integration smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify public API CORS preflight
        run: |
          node --input-type=module <<'NODE'
          const origin = 'https://timileyinadekunle17-dev.github.io';
          const response = await fetch('https://de-impresa-audit.vercel.app/api/audit', {
            method: 'OPTIONS',
            headers: {
              Origin: origin,
              'Access-Control-Request-Method': 'POST',
              'Access-Control-Request-Headers': 'content-type'
            }
          });
          const allowed = response.headers.get('access-control-allow-origin');
          if (response.status !== 204 || allowed !== origin) {
            throw new Error(`CORS preflight failed: status=${response.status}, allow-origin=${allowed}`);
          }
          console.log('CORS preflight passed for', origin);
          NODE

      - name: Run real JSON audit and verify Lighthouse data
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://de-impresa-audit.vercel.app/api/audit', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: 'https://example.com', format: 'json' })
          });
          const body = await response.text();
          if (!response.ok) throw new Error(`Audit API returned ${response.status}: ${body.slice(0, 800)}`);
          const result = JSON.parse(body);
          if (!result.success || !result.audit?.inspection?.finalUrl) {
            throw new Error('Audit API did not return a completed website inspection.');
          }
          const lighthouse = result.audit.lighthouse;
          if (!lighthouse?.mobile || !lighthouse?.desktop) {
            throw new Error('Lighthouse mobile and desktop results were not both returned.');
          }
          console.log(JSON.stringify({
            status: 'passed',
            url: result.audit.inspection.finalUrl,
            lighthouseMobile: lighthouse.mobile.categories,
            lighthouseDesktop: lighthouse.desktop.categories,
            pageSpeedInsights: result.audit.external?.pageSpeedInsights?.status || 'not reported'
          }, null, 2));
          NODE

      - name: Generate and verify PDF report
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch('https://de-impresa-audit.vercel.app/api/audit', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: 'https://example.com', format: 'pdf' })
          });
          if (!response.ok) {
            const body = await response.text();
            throw new Error(`PDF audit returned ${response.status}: ${body.slice(0, 800)}`);
          }
          const type = response.headers.get('content-type') || '';
          const bytes = new Uint8Array(await response.arrayBuffer());
          const signature = new TextDecoder().decode(bytes.slice(0, 5));
          if (!type.includes('application/pdf') || signature !== '%PDF-') {
            throw new Error(`PDF verification failed: content-type=${type}, signature=${signature}`);
          }
          console.log(`PDF report passed: ${bytes.length} bytes, ${type}`);
          NODE
